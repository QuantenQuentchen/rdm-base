# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest

    container: debian:13
    
    steps:
    - uses: actions/checkout@v7

    - name: Install system dependencies
      run: |
        apt-get update
        apt-get install -y ca-certificates curl
        update-ca-certificates

    - name: Debug fingerprint
      env:
        FP: ${{ secrets.VPS_FINGERPRINT }}
      run: |
        printf '%s' "$FP" | sha256sum
        printf 'length=%s\n' "${#FP}"

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    - name: Set up npm
      uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Build Backend
      working-directory: rdm-backend
      env:
        baseUrl: ${{vars.PUBLIC_DOMAIN}}
      run: go build -ldflags="-X main.baseUrl=$baseUrl" -o server

    - name: Test Backend
      working-directory: rdm-backend
      run: go test -v ./...

    - name: Frontend Install
      working-directory: rdm-frontend
      run: npm install

    - name: Test Frontend
      working-directory: rdm-frontend
      run: npm ci

    - name: Build Frontend
      working-directory: rdm-frontend
      run: npm run build
      env:
        VITE_API_BASE_URL: ${{vars.PUBLIC_DOMAIN}}

    - name: Copy to server
      uses: appleboy/scp-action@v1
      with:
        host: ${{ vars.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
#        fingerprint: ${{ secrets.VPS_FINGERPRINT }}
        source: "rdm-frontend/dist/*"
        target: "~/apps/rdm/resources/web/"
        strip_components: 2


    - name: Copy binary to server
      uses: appleboy/scp-action@v1
      with:
        host: ${{ vars.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
#        fingerprint: ${{ secrets.VPS_FINGERPRINT }}
        source: "rdm-backend/server"
        target: "~/apps/rdm/"
        strip_components: 1

    - name: Restart the dang thing
      uses: appleboy/ssh-action@v1
      env:
        SERVICE: ${{ vars.SERVICE_NAME }}

      with:
        host: ${{ vars.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
#        fingerprint: ${{ secrets.VPS_FINGERPRINT }}
        envs: SERVICE
        script: |
          echo "SERVICE=[$SERVICE]"
          command -v systemctl
          sudo -n -l
          sudo -n /usr/bin/systemctl restart "$SERVICE"
          sudo -n systemctl is-active --quiet "$SERVICE"