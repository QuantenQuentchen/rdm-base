# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest

    container: debian:13
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'

    - name: Set up npm
      uses: actions/setup-node@4
      with:
        node-version: 22

    - name: Build Backend
      working-directory: rdm-backend
      run: go build -v ./...

    - name: Test Backend
      working-directory: rdm-backend
      run: go test -v ./...

    - name: Test Frontend
      working-directory: rdm-frontend
      run: npm ci

    - name: Build Frontend
      working-directory: rdm-frontend
      run: npm run build
